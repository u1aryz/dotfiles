[tools]
taplo = "latest"
prettier = "latest"

[tasks.format]
run = [
  "find .fish -type f -name '*.fish' -exec fish_indent -w {} +",
  "taplo format .herdr/config.toml .mise/config.toml mise.toml",
  "prettier --write .ccstatusline/settings.json .claude/settings.json .docker/config.json .karabiner/karabiner.json .pi/agent/model-profiles.json .pi/agent/permission-modes.json .pi/agent/settings.json .vscode/settings.json",
]
