# Herdr GPUI のユーザー設定。未指定の項目は既定値を継承し、保存時に自動反映される
layout = "normal-rounded"
theme = "Zenwritten Dark"

[keybindings]
# prefix+Shift+H は hunk-layout.sh 用に空け、左ペインとの交換を無効化する
swap_pane_left = []

# Shift+Enter の Alt+Enter への変換を無効化し、Pi での改行を維持する
[pane_keys]
"shift-enter" = ""
# 単語移動への変換を無効化し、config.toml のペイン優先・タブ移動を使用する
"alt-left" = ""
"alt-right" = ""

[terminal]
size = 12.0

# ウィンドウ背景の透過とぼかし
[backdrop]
opacity = 0.92
blur = true
