onboarding = false

[theme]
# Ghostty のテーマ (Zenwritten Dark) にそのまま追従させる
name = "terminal"

[keys]
# zellij tmux モードの d (Detach) に合わせる (デフォルトは prefix+q)
detach = "prefix+d"
# zellij の Alt+hjkl ペイン移動に合わせた直接バインド (デフォルトは prefix+h/j/k/l)
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
# 新規ワークスペース作成 (デフォルトは prefix+shift+n で押しにくいため直接バインドに変更)
new_workspace = "alt+n"
# macOS のウィンドウ切り替え (cmd+` / cmd+shift+`) でワークスペースを循環
# Ghostty が cmd キーを端末に送らないため、Ghostty 側で CSI-u シーケンスに変換して送信 (.ghostty/config 参照)
next_workspace = "cmd+backtick"
previous_workspace = "cmd+shift+backtick"
# ctrl+tab / ctrl+shift+tab または prefix+n / prefix+p で Window (タブ) を循環
# Ghostty がデフォルトで ctrl+tab を自身のタブ切り替えに使うため、Ghostty 側で CSI-u に変換して送信 (.ghostty/config 参照)
next_tab = ["ctrl+tab", "prefix+n"]
previous_tab = ["ctrl+shift+tab", "prefix+p"]

# 現在のタブを左にhunk、右側に上下2つのプロンプトの構成に変更
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "sh ~/.config/herdr/hunk-layout.sh"
description = "現在のタブを3ペイン構成に変更"

# option + 矢印キーはペイン優先のハイブリッド移動 (nav.sh 参照)
# その方向にペインがあればペイン移動、なければ左右=タブ移動 (上下はペイン移動のみ)
[[keys.command]]
key = "alt+left"
type = "shell"
command = "sh ~/.config/herdr/nav.sh left"
description = "ペイン優先で左移動 (なければ前のタブ)"

[[keys.command]]
key = "alt+right"
type = "shell"
command = "sh ~/.config/herdr/nav.sh right"
description = "ペイン優先で右移動 (なければ次のタブ)"

[[keys.command]]
key = "alt+up"
type = "shell"
command = "sh ~/.config/herdr/nav.sh up"
description = "ペインの上移動"

[[keys.command]]
key = "alt+down"
type = "shell"
command = "sh ~/.config/herdr/nav.sh down"
description = "ペインの下移動"

# herdr-file-viewer プラグインの起動 (README 推奨のキー割り当て)
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "ファイルビューアをスプリットで開く"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "ファイルビューアをタブで開く (既に開いていれば切り替え)"

[ui]
agent_panel_sort = "priority"
# window (タブ) 追加時の名前入力プロンプトをスキップし、即座に作成する
prompt_new_tab_name = false

[ui.sidebar.spaces]
# ワークスペース一覧のエントリ間に空行1行を入れて行間を広げる (デフォルトは0)
row_gap = 1

[advanced]
# zellij の scroll_buffer_size 100000 (デフォルト10倍) に合わせて 10MB → 100MB
scrollback_limit_bytes = 100_000_000
